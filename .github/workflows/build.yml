name: Build NeoForge JAR

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      # An uploaded SDT_Assets.zip can be unpacked into the JAR as raw resources.
      # Resource inclusion does NOT implement the SDT transformation renderer.
      - name: Import optional SDT model resources
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          from zipfile import ZipFile

          archives = [Path("SDT_Assets.zip"), Path("SDT_Assets(1).zip")]
          archive = next((p for p in archives if p.is_file()), None)

          if archive is None:
              print("No SDT_Assets.zip found; compiling keybind/particles prototype only.")
          else:
              patterns = [
                  r"^assets/invincible_dmc/animmodels/entity/sin_devil_armor\.json$",
                  r"^assets/invincible_dmc/animmodels/animations/biped/yamato/living/(?:data/)?yamato_sin_devil_trigger(?:_back)?\.json$",
                  r"^assets/invincible_dmc/animmodels/animations/biped/yamato/living/yamato_(?:idle(?:_2(?:_start)?|_3)?|walk(?:_lockon)?|run|sneak|jump)\.json$",
                  r"^assets/invincible_dmc/models/obj/sdt\.obj$",
                  r"^assets/invincible_dmc/textures/models/obj/sdt(?:_l)?\.png$",
                  r"^assets/invincible_dmc/textures/mesh/sin_devil/[^/]+\.png$",
              ]
              root = Path("src/main/resources").resolve()
              extracted = []
              with ZipFile(archive) as zip_file:
                  for entry in zip_file.infolist():
                      source_name = entry.filename.replace("\\", "/")
                      marker = "assets/invincible_dmc/"
                      marker_index = source_name.find(marker)
                      if marker_index < 0 or entry.is_dir():
                          continue
                      name = source_name[marker_index:]
                      if not any(re.fullmatch(p, name) for p in patterns):
                          continue
                      target = (root / name).resolve()
                      if not target.is_relative_to(root):
                          raise ValueError("Unexpected zip path: " + name)
                      target.parent.mkdir(parents=True, exist_ok=True)
                      target.write_bytes(zip_file.read(entry))
                      extracted.append(name)

              print("First archive entries:", zip_file.namelist()[:6])
              print(f"Imported {len(extracted)} model/animation/texture files from {archive.name}:")
              for name in extracted:
                  print(" +", name)
              armor_json = root / "assets/invincible_dmc/animmodels/entity/sin_devil_armor.json"
              if armor_json.exists():
                  import json
                  obj = json.loads(armor_json.read_text(encoding="utf-8"))
                  print("SDT ARMOR JSON root keys:", list(obj) if isinstance(obj, dict) else type(obj))
                  print("SDT ARMOR JSON preview:", armor_json.read_text(encoding="utf-8")[:2200])
              for anim_name in ("yamato_sin_devil_trigger.json","yamato_sin_devil_trigger_back.json"):
                  anim = root / "assets/invincible_dmc/animmodels/animations/biped/yamato/living" / anim_name
                  if anim.exists():
                      import json
                      obj = json.loads(anim.read_text(encoding="utf-8"))
                      print("SDT ANIMATION:", anim_name, "keys:", list(obj) if isinstance(obj, dict) else type(obj))
                      print("SDT ANIMATION preview:", anim.read_text(encoding="utf-8")[:1000])
              if not extracted:
                  raise RuntimeError("Uploaded SDT_Assets.zip contains no expected model resources")
          PY

      - name: Build prototype JAR
        run: gradle --no-daemon build --stacktrace

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vergil-SDT-Prototype-JAR
          path: build/libs/*.jar
          if-no-files-found: error
