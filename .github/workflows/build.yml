name: Build NeoForge JAR

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Import SDT assets into a private resource path
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          from zipfile import ZipFile

          archive = next((p for p in (Path("SDT_Assets.zip"), Path("SDT_Assets(1).zip")) if p.is_file()), None)
          if archive is None:
              raise RuntimeError("SDT_Assets.zip must be in repository root")

          allowed = [
              r"animmodels/entity/sin_devil_armor\.json",
              r"animmodels/animations/biped/yamato/living/(?:data/)?yamato_sin_devil_trigger(?:_back)?\.json",
              r"models/obj/sdt\.obj",
              r"textures/models/obj/sdt(?:_l)?\.png",
              r"textures/mesh/sin_devil/[^/]+\.png",
          ]
          prefix = "assets/invincible_dmc/"
          destination = Path("src/main/resources/assets/vergilsdt/sdt_data").resolve()
          imported = []

          with ZipFile(archive) as z:
              for entry in z.infolist():
                  name = entry.filename.replace("\\", "/")
                  if entry.is_dir():
                      continue
                  at = name.find(prefix)
                  if at < 0:
                      continue
                  relative = name[at + len(prefix):]
                  if not any(re.fullmatch(p, relative) for p in allowed):
                      continue
                  target = (destination / relative).resolve()
                  if not target.is_relative_to(destination):
                      raise RuntimeError("Unexpected ZIP entry: " + name)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(z.read(entry))
                  imported.append(relative)

          required = [
              "models/obj/sdt.obj",
              "textures/models/obj/sdt.png",
              "animmodels/animations/biped/yamato/living/yamato_sin_devil_trigger.json",
              "animmodels/animations/biped/yamato/living/yamato_sin_devil_trigger_back.json",
          ]
          missing = [path for path in required if path not in imported]
          print("Imported", len(imported), "SDT resources in isolated assets/vergilsdt/sdt_data/")
          print("Files:", imported)
          if missing:
              raise RuntimeError("Required SDT resources missing: " + str(missing))

          # These paths are scanned by the original Epic Fight animation loader.
          # This standalone cosmetic mod must NOT publish anything there.
          original_namespace = Path("src/main/resources/assets/invincible_dmc")
          if original_namespace.exists():
              raise RuntimeError("Original Epic Fight resource namespace must not be bundled")
          PY

      - name: Validate original weighted mesh format
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path("src/main/resources/assets/vergilsdt/sdt_data/animmodels/entity/sin_devil_armor.json")
          m = json.loads(path.read_text(encoding="utf-8"))["vertices"]
          arr = lambda key: m[key]["array"]
          points, counts, weights, pairs, triangles = (
              arr("positions"), arr("vcounts"), arr("weights"),
              arr("vindices"), m["parts"]["noGroups"]["array"]
          )
          assert len(points) == 3*len(counts), "Position count mismatch"
          assert len(pairs) == 2*sum(counts), "Joint-weight pair mismatch"
          assert len(triangles) % 9 == 0, "Triangle index stream malformed"
          assert len(weights) > 0, "No skinning weights"
          joints = set(pairs[::2])
          assert all(0 <= i < 20 for i in joints), "Unexpected armature joint ID"
          print("SKINNING CHECK:",
                len(counts), "weighted vertices",
                len(triangles)//9, "triangles",
                len(weights), "weight values",
                len(joints), "used bones")
          PY

      - name: Build NeoForge 1.21.1 mod
        run: gradle --no-daemon clean build --stacktrace

      - name: Verify isolated JAR resources
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          jars = sorted(Path("build/libs").glob("*.jar"))
          if not jars:
              raise RuntimeError("No build JAR found")
          for jar in jars:
              with ZipFile(jar) as zip_file:
                  names = set(zip_file.namelist())
                  expected = {
                      "assets/vergilsdt/sdt_data/models/obj/sdt.obj",
                      "assets/vergilsdt/sdt_data/animmodels/entity/sin_devil_armor.json",
                      "assets/vergilsdt/sdt_data/textures/mesh/sin_devil/sin_devil.png",
                      "assets/vergilsdt/sdt_data/textures/models/obj/sdt.png",
                      "assets/vergilsdt/sdt_data/animmodels/animations/biped/yamato/living/yamato_sin_devil_trigger.json",
                      "assets/vergilsdt/sdt_data/animmodels/animations/biped/yamato/living/yamato_sin_devil_trigger_back.json",
                  }
                  missing = expected - names
                  unsafe = [name for name in names if name.startswith("assets/invincible_dmc/")]
                  print("JAR:",jar.name, "bytes:",jar.stat().st_size)
                  print("Isolated SDT resources:",sum(name.startswith("assets/vergilsdt/sdt_data/") for name in names))
                  if missing:
                      raise RuntimeError("Missing resource entries: " + str(missing))
                  if unsafe:
                      raise RuntimeError("Unexpected original Epic Fight asset paths: " + str(unsafe[:10]))
          PY

      - name: Upload playable JAR (unverified in-game)
        uses: actions/upload-artifact@v4
        with:
          name: Vergil-SDT-NeoForge-1.21.1-v0.4.0
          path: build/libs/*.jar
          if-no-files-found: error
