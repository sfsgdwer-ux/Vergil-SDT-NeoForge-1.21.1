name: Inspect SDT Weighted Mesh

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-sdt.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Analyze skin weights and animation bone identities
        shell: bash
        run: |
          python3 - <<'PY'
          from collections import Counter
          from pathlib import Path
          from zipfile import ZipFile
          import json
          with ZipFile("SDT_Assets.zip") as z:
              names={n.replace("\\","/"):n for n in z.namelist()}
              def read(path):
                  return z.read(names["assets/invincible_dmc/"+path])
              model=json.loads(read("animmodels/entity/sin_devil_armor.json"))
              v=model["vertices"]
              print("MODEL FPS:",model.get("fps"))
              for name in ("positions","uvs","normals","vcounts","weights","vindices"):
                  x=v[name]
                  a=x["array"]
                  print("FIELD:",name,"stride",x["stride"],"count",x["count"],
                        "array_length",len(a),"min",min(a),"max",max(a),
                        "first20",a[:20])
              counts=v["vcounts"]["array"]
              indices=v["vindices"]["array"]
              weights=v["weights"]["array"]
              parts=v["parts"]["noGroups"]["array"]
              print("COUNT SUM:",sum(counts),"VINDICES LEN:",len(indices),"EXPECTED:",2*sum(counts))
              print("COUNTS:",dict(sorted(Counter(counts).items())))
              print("INFLUENCE JOINT IDs:",sorted(set(indices[::2])))
              print("INFLUENCE WEIGHT INDEX RANGE:",min(indices[1::2]),max(indices[1::2]))
              print("MOST USED JOINTS:",Counter(indices[::2]).most_common())
              print("WEIGHTS MAX/INDEX:",len(weights)-1)
              print("TRIANGLE CORNER COUNT:",len(parts)//3)
              print("TRIANGLE INDICES first 15:",parts[:45])
              print("TRIANGLE COORD INDEX MAX:",max(parts[::3]))
              print("TRIANGLE UV INDEX MAX:",max(parts[1::3]))
              print("TRIANGLE NORM INDEX MAX:",max(parts[2::3]))
              print("MESH BOUNDS:",[
                  (min(v["positions"]["array"][j::3]),max(v["positions"]["array"][j::3]))
                  for j in (0,1,2)
              ])
              pos=v["positions"]["array"]
              offset=0
              buckets={}
              for i,n in enumerate(counts):
                  if n:
                      pairs=[(indices[offset+2*k],weights[indices[offset+2*k+1]]) for k in range(n)]
                      offset+=2*n
                      if sum(weight for joint,weight in pairs)>0:
                          key=max(pairs,key=lambda p:p[1])[0]
                          buckets.setdefault(key,[]).append((pos[3*i],pos[3*i+1],pos[3*i+2]))
              for joint,xyz in sorted(buckets.items()):
                  center=[sum(p[j] for p in xyz)/len(xyz) for j in range(3)]
                  lo=[min(p[j] for p in xyz) for j in range(3)]
                  hi=[max(p[j] for p in xyz) for j in range(3)]
                  print("JOINT DOMINANT:",joint,"count",len(xyz),"centroid",center,"bounds",list(zip(lo,hi)))
              clips=[
                  "animmodels/animations/biped/yamato/living/yamato_sin_devil_trigger.json",
                  "animmodels/animations/biped/yamato/living/yamato_sin_devil_trigger_back.json"
              ]
              for clip in clips:
                  o=json.loads(read(clip))
                  print("CLIP:",clip,"fps",o.get("fps"),"bones",[(i,x.get("name")) for i,x in enumerate(o["animation"])])
                  print("CLIP TIME MAX:",max(max(x.get("time",[0])) for x in o["animation"]))
          PY
